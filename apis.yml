name: Fundly
description: 'Fundly is a Mumbai-based fintech platform purpose-built for India''s pharmaceutical
  retail supply chain, offering embedded credit, B2B commerce, and payment solutions to
  pharma retailers and distributors. Its lending product provides unsecured working capital
  with interest charged only for the period funds are actually drawn, alongside B2B commerce
  tooling and payment rails tailored to the cash-flow cycles of the pharma industry. Backed
  by Accel, Fundly distributes primarily through native iOS and Android apps and works with
  RBI-regulated lending partners. No public API, developer portal, or technical documentation
  is currently published; this profile tracks the company for the API Evangelist network.'
